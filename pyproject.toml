[project]
name = "zlog"
version = "1.1.0"
description = "A live log viewer for Android devices, Windows apps, and log files."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Vu" }]
dependencies = [
    "PySide6>=6.6",
    # Windows Event Log capture (see docs/plans/windows-event-log.md); the
    # marker keeps Linux/macOS/CI from ever installing it.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
zlog = "zlog.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Capped: some releases' formatter mangles tuple `except` clauses (see
    # core/settings.py). Pin the upper bound so an upgrade can't rewrite valid code.
    "ruff>=0.5,<0.16",
]
build = [
    "cx_Freeze>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_only: needs a real win32 host (skipped elsewhere, see conftest.py)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# QModelIndex() as a default arg is the standard Qt model/view idiom.
"src/zlog/ui/log_model.py" = ["B008"]
