name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # The ui/ tests construct a QApplication; install Qt's runtime libs so the
      # offscreen platform plugin can load without a display. Windows runners
      # need none of this.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglx0 libxkbcommon0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  shuffled:
    # A separate, additive job: the default suite above stays in a fixed,
    # comparable order (pyproject.toml disables the plugin by default), and
    # this one deliberately re-enables it to surface order-dependent tests on
    # purpose rather than by accident (see docs/plans/ci-shuffled-order.md).
    # Linux only and after the Windows job proved its own value first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglx0 libxkbcommon0

      # No -q: pytest-randomly's "Using --randomly-seed=..." banner line is
      # suppressed by -q, and a shuffled failure with no seed is unfixable.
      - name: Run tests (shuffled order)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -p randomly
